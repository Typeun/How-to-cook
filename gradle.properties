org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- release 签名配置 ----
# 出于安全考虑，签名密钥（.jks）与其口令**不随本仓库分发**（见 .gitignore）。
# 没有密钥时 `assembleRelease` 仍可完成，只是产出未签名的 APK；`assembleDebug` 不受影响。
#
# 如需自己出正式包，取消下面四行的注释并填入你的密钥信息，
# 或用环境变量 / 命令行 -P 参数覆盖：
#   ./gradlew assembleRelease -PCCING_STORE_FILE=/path/to/your.jks \
#       -PCCING_STORE_PASSWORD=*** -PCCING_KEY_ALIAS=*** -PCCING_KEY_PASSWORD=***
#
# CCING_STORE_FILE=../keystore/your-release.jks
# CCING_STORE_PASSWORD=
# CCING_KEY_ALIAS=
# CCING_KEY_PASSWORD=
