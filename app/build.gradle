plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.25'
}

android {
    namespace 'com.typeun.cc'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.typeun.cc"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.01"
    }

    // release 签名：密钥库与口令不随仓库分发，需自行在 gradle.properties 或 -P 参数中提供。
    // 未提供时 assembleRelease 仍可完成，但产出未签名 APK。
    signingConfigs {
        release {
            def storePath = project.findProperty("CCING_STORE_FILE")
            def f = storePath ? file(storePath) : null
            if (f != null && f.exists()) {
                storeFile f
                storePassword project.findProperty("CCING_STORE_PASSWORD")
                keyAlias project.findProperty("CCING_KEY_ALIAS")
                keyPassword project.findProperty("CCING_KEY_PASSWORD")
                enableV1Signing true   // Android 5.0/6.0 只认 v1
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.2'

    // Compose BOM 锁定版本（与 Kotlin 1.9.24 / 编译器 1.5.15 匹配）
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // Material Design 2（androidx.compose.material 即 MD2）
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'

    // JSON 序列化（1.6.x 兼容 Kotlin 1.9.x）
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
